name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Windows checks
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Use an unambiguous temporary test directory
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'nexus-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --bail 1 --maxWorkers 2
      - run: npm run build
