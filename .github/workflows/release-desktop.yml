name: Release Windows desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Require a matching, increasing stable version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must match a stable package.json version, for example v0.8.1.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read existing releases.' }
          if ($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }) { throw 'This release already exists; use a new version.' }
          $latest = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_.tag_name.Substring(1)) } -Descending | Select-Object -First 1
          if ($latest -and [version]$version -le [version]($latest.tag_name.Substring(1))) { throw 'The new version must be greater than the published version.' }
      - run: npm ci
      - name: Check Windows command runner
        shell: pwsh
        run: |
          @'
          import { spawnSync } from 'node:child_process'
          import fs from 'node:fs'
          import path from 'node:path'
          import { runCommand } from './server/services/agent/executor.mjs'
          console.log('Direct Git:', spawnSync('git', ['--version'], { encoding: 'utf8', timeout: 15000 }).stdout)
          const ps = path.join(process.env.SystemRoot, 'System32/WindowsPowerShell/v1.0/powershell.exe')
          const boot = spawnSync(ps, ['-NoLogo', '-NoProfile', '-NonInteractive', '-Command', "[Console]::Error.WriteLine('PS_READY'); Add-Type -TypeDefinition 'public class NexusProbe {}'; [Console]::Error.WriteLine('TYPE_READY')"], { encoding: 'utf8', timeout: 20000 })
          console.log('PowerShell boot:', JSON.stringify({status:boot.status,error:boot.error?.code,stdout:boot.stdout,stderr:boot.stderr}))
          const traced = path.join(process.env.RUNNER_TEMP, 'nexus-job-traced.ps1')
          const original = fs.readFileSync('server/services/agent/windows-job-runner.ps1', 'utf8')
          fs.writeFileSync(traced, original.replace('Add-Type -TypeDefinition', "[Console]::Error.WriteLine('BEFORE_COMPILE')\nAdd-Type -TypeDefinition").replace('exit [NexusJobRunner]::Run', "[Console]::Error.WriteLine('BEFORE_RUN')\nexit [NexusJobRunner]::Run"))
          const git = spawnSync('where.exe', ['git'], { encoding: 'utf8' }).stdout.trim().split(/\r?\n/)[0]
          const spec = Buffer.from(JSON.stringify({file:git,arguments:'--version',cwd:process.cwd(),parentPid:process.pid})).toString('base64')
          const tracedResult = spawnSync(ps, ['-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', traced, '-SpecBase64', spec], {encoding:'utf8',timeout:20000})
          console.log('Full-environment job runner:', JSON.stringify({status:tracedResult.status,error:tracedResult.error?.code,stdout:tracedResult.stdout,stderr:tracedResult.stderr}))
          for (const command of ['git --version', 'node --version']) {
            const result = await runCommand({ cwd: process.cwd(), command, timeoutMs: 15000 })
            console.log(JSON.stringify(result))
            if (!result.ok) throw new Error('Windows command runner preflight failed: ' + command)
          }
          '@ | node --input-type=module
          if ($LASTEXITCODE -ne 0) { throw 'Windows runner preflight failed.' }
      - run: npm run typecheck
      - run: npm run lint
      - name: Run complete regression suite
        run: npx vitest run --bail 1 --maxWorkers 2
      - run: npm run build
      - name: Build installer and update metadata
        run: npm run desktop:package:win
        env:
          # Optional Windows Authenticode certificate. Never put these in the app.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - run: npm run desktop:verify-update
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update-${{ env.RELEASE_TAG }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload all assets before publishing the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -in @('latest.yml', 'SHA256SUMS.txt') } | ForEach-Object { $_.FullName })
          $notes = "docs/releases/$($env:RELEASE_TAG).md"
          $notesArgs = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title "PROJECT NEXUS $env:RELEASE_TAG" @notesArgs --draft
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; the release remains unpublished.' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }
