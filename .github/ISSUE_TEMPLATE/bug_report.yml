name: Bug report
description: Report a reproducible problem without sharing credentials or private data.
body:
  - type: textarea
    id: description
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: NEXUS version, Windows version and architecture
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots (remove tokens and private information)
