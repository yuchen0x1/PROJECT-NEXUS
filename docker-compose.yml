services:
  nexus:
    build: .
    ports:
      - "127.0.0.1:4317:4317"
    env_file:
      - .env
    volumes:
      - nexus-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4317/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexus-data:
